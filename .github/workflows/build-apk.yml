name: Build NexMove Android APK

on:
  push:
    paths:
      - 'NexMove_V1_CloudBuild_Source.zip'
      - 'NexMove_V1_1_CloudBuild_Source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source project
        run: |
          if [ -f NexMove_V1_1_CloudBuild_Source.zip ]; then
            unzip -q -o NexMove_V1_1_CloudBuild_Source.zip
          elif [ -f NexMove_V1_CloudBuild_Source.zip ]; then
            unzip -q -o NexMove_V1_CloudBuild_Source.zip
          else
            echo 'Source archive missing'; exit 1
          fi
          test -f NexMove_AndroidStudio/settings.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK from runner tools
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)
          fi
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon -p NexMove_AndroidStudio :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NexMove-v1.1-debug-apk
          path: NexMove_AndroidStudio/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
