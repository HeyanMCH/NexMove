name: Build NexMove Android APK

on:
  push:
    paths:
      - 'NexMove_V1_2_CloudBuild_Source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Unpack V1.2 source
        run: |
          test -f NexMove_V1_2_CloudBuild_Source.zip || { echo 'Upload NexMove_V1_2_CloudBuild_Source.zip'; exit 1; }
          unzip -q -o NexMove_V1_2_CloudBuild_Source.zip
          test -f NexMove_AndroidStudio/settings.gradle.kts
          grep -q 'versionName = "1.2.0"' NexMove_AndroidStudio/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using runner command-line tools
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)
          fi
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build V1.2 debug APK
        run: gradle --no-daemon -p NexMove_AndroidStudio :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NexMove-v1.2-debug-apk
          path: NexMove_AndroidStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
